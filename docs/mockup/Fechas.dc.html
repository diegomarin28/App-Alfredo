<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cumpleaños y fechas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E8C;text-decoration:none}a:hover{color:#183E70}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #1C1F24; box-sizing: border-box">
<div style="padding: 28px 20px 0 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Calendario</h1>
<button type="button" aria-label="Agregar fecha" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="background: #1F4E8C; color: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 600; color: #C9D8EE">EL PRÓXIMO</span>
<span style="font-size: 22px; font-weight: 700">Martín cumple [edad]</span>
<span style="font-size: 15px; color: #E3EBF6">Miércoles 25 · en 3 días</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Saludo para Martín</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{opciones}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.elegir}}" style="{{o.estilo}}">{{o.nombre}}</button>
</sc-for>
</div>
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5F646B">Podés cambiarlo antes de mandarlo</span>
<textarea rows="3" value="{{texto}}" onChange="{{cambiar}}" style="border: 1px solid #E3E8EF; border-radius: 12px; background: #F5F7FA; padding: 10px 12px; font-family: inherit; font-size: 16px; color: #1C1F24; resize: none; outline: none"></textarea>
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: #1F4E8C; color: #FFFFFF; font-size: 15px; font-weight: 600">Enviar por WhatsApp</a>
<button type="button" style="min-height: 48px; border-radius: 12px; border: none; background: #E3EBF6; color: #1F4E8C; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Copiar</button>
</div>
</div>
<a href="Recordatorios.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 14px; padding: 12px 14px; color: #1C1F24; min-height: 44px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #E3EBF6; color: #1F4E8C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">Recordatorios del año</span><span style="font-size: 14px; color: #5F646B">Navidad, fin de año, pasajes y más</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F646B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #5F646B">Diciembre</h2>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 14px; padding: 10px 14px">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #F5F7FA; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 17px; font-weight: 700">04</span><span style="font-size: 11px; color: #5F646B">DIC</span></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">[Nombre]</span><span style="font-size: 14px; color: #5F646B">Cumple [edad]</span></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 14px; padding: 10px 14px">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #F5F7FA; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 17px; font-weight: 700">18</span><span style="font-size: 11px; color: #5F646B">DIC</span></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">Aniversario de casados</span><span style="font-size: 14px; color: #5F646B">[años] años</span></span>
</div>
</div>
</div>
<nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E3E8EF; display: flex; justify-content: space-around; align-items: center; padding-bottom: 6px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Inicio</a>
<a href="Fechas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #1F4E8C; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendario</a>
<a href="Asistente.dc.html" aria-label="Hablar con el asistente" style="width: 60px; height: 60px; margin-top: -26px; border-radius: 30px; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(31,78,140,0.30); border: 4px solid #FFFFFF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
<a href="Contestar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9.5h8M8 12.5h5"></path></svg>Contestar</a>
<a href="Portofino.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 20V10l7-5 7 5v10M10 20v-5h4v5"></path></svg>Portofino</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 0;
const textos = [
'¡Feliz cumple, Martín! Que lo pases bárbaro. Un abrazo grande.',
'Muy feliz cumpleaños, Martín. Te deseo un gran año, con salud y alegría.',
'¡Feliz cumple, Martín! Que se cumplan todos tus deseos.'
];
const nombres = ['Cálido', 'Formal', 'Corto'];
const on = 'flex-grow: 1; min-height: 40px; border-radius: 10px; border: none; background: #1F4E8C; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer';
const off = 'flex-grow: 1; min-height: 40px; border-radius: 10px; border: 1px solid #E3E8EF; background: #FFFFFF; color: #3F434A; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer';
return {
texto: (this.state && this.state.custom != null) ? this.state.custom : textos[sel],
cambiar: (e) => this.setState({ custom: e.target.value }),
opciones: nombres.map((n, i) => ({ nombre: n, estilo: i === sel ? on : off, elegir: () => this.setState({ sel: i, custom: null }) }))
};
}
}
</script>
</body>
</html>
