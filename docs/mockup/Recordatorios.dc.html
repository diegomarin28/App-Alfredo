<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recordatorios del año</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E8C;text-decoration:none}a:hover{color:#183E70}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #1C1F24; box-sizing: border-box">
<div style="height: 768px; overflow-y: auto; padding: 20px 20px 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<a href="Fechas.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #1F4E8C; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Calendario</a>
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Recordatorios</h1>
<button type="button" aria-label="Agregar recordatorio" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<sc-if value="{{pendiente}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 2px solid #1F4E8C; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 20px rgba(31,78,140,0.12)">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #E3EBF6; color: #1F4E8C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">Gestionar Navidad</span><span style="font-size: 14px; color: #5F646B">Faltan 2 meses · 25 de diciembre</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{posponer}}" style="min-height: 48px; border-radius: 12px; border: none; background: #ECEFF4; color: #1C1F24; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Posponer 15 días</button>
<button type="button" onClick="{{resolver}}" style="min-height: 48px; border-radius: 12px; border: none; background: #1F4E8C; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Resuelto</button>
</div>
</div>
</sc-if>
<sc-if value="{{aviso}}" hint-placeholder-val="{{ false }}">
<div style="background: #E3EBF6; border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px">
<span style="font-size: 15px; color: #183E70; font-weight: 600">{{avisoTexto}}</span>
<button type="button" onClick="{{reiniciar}}" style="min-height: 44px; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #1F4E8C; cursor: pointer">Deshacer</button>
</div>
</sc-if>
<h2 style="margin: 4px 0 0 0; font-size: 15px; font-weight: 600; color: #5F646B">Se repiten todos los años</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{lista}}" as="r" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{r.que}}</span><span style="font-size: 14px; color: #5F646B">{{r.fecha}}</span></span>
<span style="padding: 6px 10px; border-radius: 12px; background: #ECEFF4; color: #3F434A; font-size: 13px; font-weight: 600; white-space: nowrap">{{r.aviso}}</span>
</div>
</sc-for>
</div>
<div style="background: #FFFFFF; border: 1px dashed #C9D8EE; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Nuevo recordatorio</span>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5F646B">¿Qué?</span><input type="text" placeholder="Ej.: renovar el seguro del auto" style="height: 44px; border: 1px solid #E3E8EF; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 16px; outline: none"></label>
<span style="font-size: 13px; color: #5F646B">Avisarme</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="padding: 8px 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E8EF; font-size: 14px; color: #3F434A">1 semana antes</span>
<span style="padding: 8px 12px; border-radius: 16px; background: #1F4E8C; color: #FFFFFF; font-size: 14px; font-weight: 600">1 mes antes</span>
<span style="padding: 8px 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E8EF; font-size: 14px; color: #3F434A">2 meses antes</span>
</div>
</div>
</div>
<nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E3E8EF; display: flex; justify-content: space-around; align-items: center; padding-bottom: 6px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Inicio</a>
<a href="Fechas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendario</a>
<a href="Asistente.dc.html" aria-label="Hablar con el asistente" style="width: 60px; height: 60px; margin-top: -26px; border-radius: 30px; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(31,78,140,0.30); border: 4px solid #FFFFFF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
<a href="Contestar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9.5h8M8 12.5h5"></path></svg>Contestar</a>
<a href="Portofino.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 20V10l7-5 7 5v10M10 20v-5h4v5"></path></svg>Portofino</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state && this.state.st;
return {
pendiente: !st,
aviso: !!st,
avisoTexto: st === 'pospuesto' ? 'Te lo recuerdo de nuevo en 15 días.' : '¡Listo! Navidad resuelta este año.',
posponer: () => this.setState({ st: 'pospuesto' }),
resolver: () => this.setState({ st: 'resuelto' }),
reiniciar: () => this.setState({ st: null }),
lista: [
{ que: 'Gestionar fin de año', fecha: '31 de diciembre', aviso: '2 meses antes' },
{ que: 'Cena de Navidad', fecha: '24 de diciembre', aviso: '1 mes antes' },
{ que: 'Cena de Año Nuevo', fecha: '31 de diciembre', aviso: '1 mes antes' },
{ que: 'Cena de mi cumpleaños', fecha: '[fecha]', aviso: '1 mes antes' },
{ que: 'Sacar pasajes de los chicos', fecha: '[fecha]', aviso: '2 meses antes' }
]
};
}
}
</script>
</body>
</html>
