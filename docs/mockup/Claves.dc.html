<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Contraseñas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E8C;text-decoration:none}a:hover{color:#183E70}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #1C1F24; box-sizing: border-box">
<sc-if value="{{bloqueado}}" hint-placeholder-val="{{ true }}">
<div style="height: 768px; padding: 0 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
<span style="width: 96px; height: 96px; border-radius: 28px; background: #E3EBF6; color: #1F4E8C; display: flex; align-items: center; justify-content: center"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1.5M15 9v1.5M12 9v4h-1M9.5 16a3.5 3.5 0 0 0 5 0"></path></svg></span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Contraseñas</h1>
<p style="margin: 0; font-size: 16px; color: #5F646B">Protegidas con Face ID y cifradas en tu celular. Se bloquean solas al salir.</p>
<button type="button" onClick="{{desbloquear}}" style="height: 52px; padding: 0 28px; border-radius: 26px; border: none; background: #1F4E8C; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Desbloquear con Face ID</button>
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600">Volver al inicio</a>
</div>
</sc-if>
<sc-if value="{{abierto}}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #1F4E8C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Inicio</a>
<button type="button" onClick="{{bloquear}}" style="min-height: 44px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #1F4E8C; cursor: pointer">Bloquear</button>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Contraseñas</h1>
<button type="button" aria-label="Agregar contraseña" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{claves}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 14px; padding: 12px 10px 12px 14px; display: flex; align-items: center; gap: 10px">
<span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{k.sitio}}</span><span style="font-size: 14px; color: #5F646B">{{k.usuario}}</span><span style="font-size: 15px; letter-spacing: 2px; color: #3F434A">••••••••••</span></span>
<button type="button" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: none; background: #E3EBF6; color: #1F4E8C; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Copiar</button>
</div>
</sc-for>
</div>
</div>
</sc-if>
<nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E3E8EF; display: flex; justify-content: space-around; align-items: center; padding-bottom: 6px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Inicio</a>
<a href="Fechas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendario</a>
<a href="Asistente.dc.html" aria-label="Hablar con el asistente" style="width: 60px; height: 60px; margin-top: -26px; border-radius: 30px; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(31,78,140,0.30); border: 4px solid #FFFFFF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
<a href="Contestar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9.5h8M8 12.5h5"></path></svg>Contestar</a>
<a href="Portofino.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 20V10l7-5 7 5v10M10 20v-5h4v5"></path></svg>Portofino</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const abierto = !!(this.state && this.state.abierto);
return {
bloqueado: !abierto,
abierto: abierto,
desbloquear: () => this.setState({ abierto: true }),
bloquear: () => this.setState({ abierto: false }),
claves: [
{ sitio: 'Banco [nombre]', usuario: '[usuario]' },
{ sitio: 'Correo', usuario: '[correo]' },
{ sitio: 'BPS / DGI en línea', usuario: '[usuario]' },
{ sitio: 'Wifi Portofino', usuario: '[red]' }
]
};
}
}
</script>
</body>
</html>
