<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Documentos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E8C;text-decoration:none}a:hover{color:#183E70}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F7FA; font-family: Inter, system-ui, sans-serif; color: #1C1F24; box-sizing: border-box">
<sc-if value="{{enCarpetas}}" hint-placeholder-val="{{ true }}">
<div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #1F4E8C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Inicio</a>
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Documentos</h1>
<button type="button" aria-label="Nueva carpeta" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{carpetas}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.abrir}}" style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; cursor: pointer; font-family: inherit; text-align: left">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #E3EBF6; color: #1F4E8C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
<span style="font-size: 16px; font-weight: 600; color: #1C1F24">{{c.nombre}}</span>
<span style="font-size: 14px; color: #5F646B">{{c.cant}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{enFotos}}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">
<button type="button" onClick="{{volver}}" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 44px; border: none; background: transparent; padding: 0; font-family: inherit; font-size: 15px; font-weight: 600; color: #1F4E8C; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Documentos</button>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">{{carpeta}}</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{fotos}}" as="f" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 120px; background: #DDE3EC; display: flex; align-items: center; justify-content: center; color: #5F646B; font-size: 13px">Vista previa</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">{{f.titulo}}</span>
<span style="font-size: 13px; color: #5F646B">{{f.fecha}}</span>
</div>
</div>
</sc-for>
</div>
</div>
<button type="button" style="position: absolute; left: 20px; right: 20px; bottom: 96px; height: 56px; border-radius: 28px; border: none; background: #1F4E8C; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Sacar foto</button>
</sc-if>
<nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E3E8EF; display: flex; justify-content: space-around; align-items: center; padding-bottom: 6px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Inicio</a>
<a href="Fechas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendario</a>
<a href="Asistente.dc.html" aria-label="Hablar con el asistente" style="width: 60px; height: 60px; margin-top: -26px; border-radius: 30px; background: #1F4E8C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(31,78,140,0.30); border: 4px solid #FFFFFF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
<a href="Contestar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9.5h8M8 12.5h5"></path></svg>Contestar</a>
<a href="Portofino.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; min-height: 48px; color: #5F646B; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 20V10l7-5 7 5v10M10 20v-5h4v5"></path></svg>Portofino</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const abierta = this.state && this.state.carpeta;
const lista = [
{ nombre: 'Seguros', cant: '4 documentos' },
{ nombre: 'Escrituras', cant: '2 documentos' },
{ nombre: 'Autos', cant: '3 documentos' },
{ nombre: 'Personales', cant: '5 documentos' }
];
return {
enCarpetas: !abierta,
enFotos: !!abierta,
carpeta: abierta || '',
carpetas: lista.map((c) => ({ ...c, abrir: () => this.setState({ carpeta: c.nombre }) })),
volver: () => this.setState({ carpeta: null }),
fotos: [
{ titulo: 'Póliza auto', fecha: 'Vence [fecha]' },
{ titulo: 'Seguro hogar Portofino', fecha: 'Vence [fecha]' },
{ titulo: 'Seguro Malibú', fecha: 'Vence [fecha]' },
{ titulo: 'Seguro de vida', fecha: 'Agregado [fecha]' }
]
};
}
}
</script>
</body>
</html>
